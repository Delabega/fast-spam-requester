name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build-release:
    name: Build on ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_src: fast-spam-requester
            asset_name: fast-spam-requester-x86_64-unknown-linux-gnu

          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_src: fast-spam-requester.exe
            asset_name: fast-spam-requester-x86_64-pc-windows-msvc.exe

          - os: macos-latest
            target: aarch64-apple-darwin
            binary_src: fast-spam-requester
            asset_name: fast-spam-requester-aarch64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build release binary
        run: cargo build --release --target ${{ matrix.target }}

      - name: Prepare binary (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/${{ matrix.binary_src }}" -Destination "${{ matrix.asset_name }}"

      - name: Prepare binary (Unix)
        if: matrix.os != 'windows-latest'
        run: |
          cp "target/${{ matrix.target }}/release/${{ matrix.binary_src }}" "${{ matrix.asset_name }}"
          chmod +x "${{ matrix.asset_name }}"

      - name: Upload binary to Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.asset_name }}